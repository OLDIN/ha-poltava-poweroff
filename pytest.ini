[pytest]
# pytest configuration for ha-poltava-poweroff
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Add custom_components and the repo root to PYTHONPATH for imports
pythonpath = custom_components .
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    real_poe: talk to the (mocked) poe.pl.ua HTTP layer instead of the offline stub
