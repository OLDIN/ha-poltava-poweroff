name: Release

# Publishes a GitHub Release whenever a merged PR changes the version in
# manifest.json. Same steps as `python scripts/bump_version.py release`,
# which stays available as a manual fallback.

on:
  push:
    branches: [main]
    paths:
      - custom_components/poltava_poweroff/manifest.json
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish release
    # Manual runs from other branches must not publish unmerged code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(jq -r .version custom_components/poltava_poweroff/manifest.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version in manifest.json: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check tag and release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Checked separately, so a run that pushed the tag but failed to
          # create the release is finished by the next run.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "tag=true" >> "$GITHUB_OUTPUT"
            tagged=$(git rev-parse "$TAG^{commit}")
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::notice::$TAG already points to ${tagged:0:7}; the release (if missing) is created for that commit"
            fi
          else
            echo "tag=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            echo "::notice::$TAG is already released, nothing to do"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.check.outputs.tag == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        if: steps.check.outputs.release == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="RELEASE_NOTES_${VERSION}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes"
          else
            echo "::warning::$notes not found, using GitHub-generated notes"
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          echo "### Released [$TAG](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
